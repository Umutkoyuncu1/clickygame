<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click Game</title>
</head>

<body>

<h1>Click Game</h1>

<p>Score: <span id="scoreDisplay">0</span></p>
<p>Time left: <span id="timerDisplay">60</span></p>

<button id="button1">Click me!</button>

<p id="finalScore" style="display:none;"></p>

<label id="label1" for="name" style="display:none;">Enter your name:</label>
<input type="text" id="name" minlength="3" maxlength="16" style="display:none;">

<button id="button2" style="display:none;">Submit Score</button>

<p id="message"></p>

<h2>🏆 Leaderboard (Top 10)</h2>
<ol id="highscoreList"></ol>

<script src="js/app.js"></script>

</body>
</html>
